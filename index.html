<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>พื้นที่ทบทวนความรู้สึก</title>

  <style>
 body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background-image: url("bg.png");
  background-repeat: no-repeat;
  background-position: center center;
  background-size: contain;   /* เห็นรูปครบ ไม่ตัดขอบ */
  background-color: #f7f3ee;  /* สีพื้นหลังกรณีรูปไม่เต็มจอ */
  background-attachment: fixed;

  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  overflow: hidden;
  animation: fadeIn 1.2s ease;
}

   
</body>
</html>
